server:
  port: 19097

spring:
  application:
    name: delivery-service
  rabbitmq:
    host: ${RABBITMQ_HOST:rabbitmq}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USERNAME:guest}
    password: ${RABBITMQ_PASSWORD:guest}
    # Outbox Relay가 브로커의 ack를 확인한 뒤에만 PUBLISHED로 표시하기 위해 필요하다.
    publisher-confirm-type: correlated
    listener:
      simple:
        retry:
          enabled: true
          max-attempts: 3
          initial-interval: 1000ms
          multiplier: 2
          max-interval: 5000ms


  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/postgres}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true

eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_URL:http://localhost:19090/eureka/}


# Zipkin 적용
management:
  zipkin:
    tracing:
      endpoint: ${ZIPKIN_ENDPOINT:http://localhost:9411/api/v2/spans}
  tracing:
    sampling:
      probability: 1.0

# 서비스 간 내부 API 호출 인증 키.
# 운영에서는 INTERNAL_API_KEY 환경변수로 반드시 주입한다. 아래 기본값은 로컬 개발 전용이다.
internal:
  api-key: ${INTERNAL_API_KEY:local-dev-internal-key}
