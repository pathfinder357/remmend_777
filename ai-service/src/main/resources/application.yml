## order 서비스 연동 포트 (19096)
order-service:
  url: ${ORDER_SERVICE_URL:http://localhost:19096}
## product 서비스 연동 포트 (19095)
product-service:
  url: ${PRODUCT_SERVICE_URL:http://localhost:19095}
## delivery 서비스 연동 포트 (19097)
19096-service:
  url: ${DELIVERY_SERVICE_URL:http://localhost:19097}



## 슬랙 연동
slack:
  webhook-url: ${SLACK_WEBHOOK_URL:https://hooks.slack.com/services/test/test/test}

eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_URL:http://localhost:19090/eureka/}

# Zipkin 적용
management:
  zipkin:
    tracing:
      endpoint: ${ZIPKIN_ENDPOINT:http://localhost:9411/api/v2/spans}
  tracing:
    sampling:
      probability: 1.0

# 서비스 간 내부 API 호출 인증 키.
# 운영에서는 INTERNAL_API_KEY 환경변수로 반드시 주입한다. 아래 기본값은 로컬 개발 전용이다.
internal:
  api-key: ${INTERNAL_API_KEY:local-dev-internal-key}
