server:
  port: 19095

spring:
  application:
    name: product-service

  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/database?currentSchema=product_schema}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: update
      # ddl-auto: update
      # 유지할 때 update
      show-sql: true
    properties:
      hibernate:
        # default_schema: ${DB_SCHEMA:product_schema}
        format_sql: true


# feign timeout
  cloud:
    openfeign:
      client:
        config:
          company-service:
            connectTimeout: 3000
            readTimeout: 5000


# Eureka 클라이언트
eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_URL:http://localhost:19090/eureka/}

# Zipkin 적용
management:
  zipkin:
    tracing:
      endpoint: ${ZIPKIN_ENDPOINT:http://localhost:9411/api/v2/spans}
  tracing:
    sampling:
      probability: 1.0

# 서비스 간 내부 API 호출 인증 키.
# 운영에서는 INTERNAL_API_KEY 환경변수로 반드시 주입한다. 아래 기본값은 로컬 개발 전용이다.
internal:
  api-key: ${INTERNAL_API_KEY:local-dev-internal-key}
