networks:
  v1_network:
    driver: bridge

services:
  postgres:
    image: postgres:16
    container_name: logistics-postgres
    networks:
      - v1_network

    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}

    ports:
      - "${POSTGRES_HOST_PORT}:5432"

    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./docker/postgres/init:/docker-entrypoint-initdb.d

    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"
        ]
      interval: 5s
      timeout: 5s
      retries: 20

  rabbitmq:
    image: rabbitmq:3-management
    container_name: rabbitmq
    networks:
      - v1_network
    # 아래 포트는 로컬 디버깅(관리 콘솔)용이다. 운영 배포에서는 제거한다.
    ports:
      - "5672:5672"
      - "15672:15672"
    environment:
      RABBITMQ_DEFAULT_USER: guest
      RABBITMQ_DEFAULT_PASS: guest
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 10s



  eureka-server:
    build:
      context: eureka-server
      dockerfile: Dockerfile
    container_name: eureka-server
    networks:
      - v1_network
    # 호스트 포트를 노출하지 않는다. 외부 진입점은 gateway-service 하나뿐이며,
    # 이 서비스는 v1_network 안에서 서비스명으로만 접근할 수 있다.


  company-service:
    build:
      context: company-service
      dockerfile: Dockerfile

    container_name: company-service
    networks:
      - v1_network
    # 호스트 포트를 노출하지 않는다. 외부 진입점은 gateway-service 하나뿐이며,
    # 이 서비스는 v1_network 안에서 서비스명으로만 접근할 수 있다.

    environment:
      DB_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB}?currentSchema=company_schema
      DB_USERNAME: ${POSTGRES_USER}
      DB_PASSWORD: ${POSTGRES_PASSWORD}
      DB_SCHEMA: company_schema
      EUREKA_URL: http://eureka-server:19090/eureka/
      ZIPKIN_ENDPOINT: http://zipkin:9411/api/v2/spans

    depends_on:
      postgres:
        condition: service_healthy

  product-service:
    build:
      context: product-service
      dockerfile: Dockerfile

    container_name: product-service
    networks:
      - v1_network
    # 호스트 포트를 노출하지 않는다. 외부 진입점은 gateway-service 하나뿐이며,
    # 이 서비스는 v1_network 안에서 서비스명으로만 접근할 수 있다.

    environment:
      DB_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB}?currentSchema=product_schema
      DB_USERNAME: ${POSTGRES_USER}
      DB_PASSWORD: ${POSTGRES_PASSWORD}
      DB_SCHEMA: product_schema
      EUREKA_URL: http://eureka-server:19090/eureka/
      ZIPKIN_ENDPOINT: http://zipkin:9411/api/v2/spans
      INTERNAL_API_KEY: ${INTERNAL_API_KEY}

      SPRING_JPA_HIBERNATE_DDL_AUTO: create

    depends_on:
      postgres:
        condition: service_healthy

  hub-service:
    build:
      context: hub
      dockerfile: Dockerfile

    container_name: hub-service
    networks:
      - v1_network
    # 호스트 포트를 노출하지 않는다. 외부 진입점은 gateway-service 하나뿐이며,
    # 이 서비스는 v1_network 안에서 서비스명으로만 접근할 수 있다.

    environment:
      DB_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB}?currentSchema=hub_schema
      DB_USERNAME: ${POSTGRES_USER}
      DB_PASSWORD: ${POSTGRES_PASSWORD}
      EUREKA_URL: http://eureka-server:19090/eureka/
      ZIPKIN_ENDPOINT: http://zipkin:9411/api/v2/spans
      INTERNAL_API_KEY: ${INTERNAL_API_KEY}

    depends_on:
      postgres:
        condition: service_healthy

  order-service:
    build:
      context: order
      dockerfile: Dockerfile

    container_name: order-service
    networks:
      - v1_network
    # 호스트 포트를 노출하지 않는다. 외부 진입점은 gateway-service 하나뿐이며,
    # 이 서비스는 v1_network 안에서 서비스명으로만 접근할 수 있다.

    environment:
      DB_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB}?currentSchema=order_schema
      DB_USERNAME: ${POSTGRES_USER}
      DB_PASSWORD: ${POSTGRES_PASSWORD}
      EUREKA_URL: http://eureka-server:19090/eureka/
      ZIPKIN_ENDPOINT: http://zipkin:9411/api/v2/spans
      INTERNAL_API_KEY: ${INTERNAL_API_KEY}
      RABBITMQ_HOST: rabbitmq

    depends_on:
      postgres:
        condition: service_healthy

  delivery-service:
    build:
      context: delivery
      dockerfile: Dockerfile

    container_name: delivery-service
    networks:
      - v1_network
    # 호스트 포트를 노출하지 않는다. 외부 진입점은 gateway-service 하나뿐이며,
    # 이 서비스는 v1_network 안에서 서비스명으로만 접근할 수 있다.

    environment:
      DB_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB}?currentSchema=delivery_schema
      DB_USERNAME: ${POSTGRES_USER}
      DB_PASSWORD: ${POSTGRES_PASSWORD}
      EUREKA_URL: http://eureka-server:19090/eureka/
      ZIPKIN_ENDPOINT: http://zipkin:9411/api/v2/spans
      INTERNAL_API_KEY: ${INTERNAL_API_KEY}

    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy

  slack-service:
    build:
      context: slack-service
      dockerfile: Dockerfile

    container_name: slack-service
    networks:
      - v1_network
    # 호스트 포트를 노출하지 않는다. 외부 진입점은 gateway-service 하나뿐이며,
    # 이 서비스는 v1_network 안에서 서비스명으로만 접근할 수 있다.

    environment:
      SPRING_PROFILES_ACTIVE: dev
      DB_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB}?currentSchema=slack_schema
      DB_USERNAME: ${POSTGRES_USER}
      DB_PASSWORD: ${POSTGRES_PASSWORD}
      EUREKA_URL: http://eureka-server:19090/eureka/
      SLACK_BOT_TOKEN: ${SLACK_BOT_TOKEN}
      SLACK_TEST_USER_ID: ${SLACK_TEST_USER_ID}
      ZIPKIN_ENDPOINT: http://zipkin:9411/api/v2/spans

    depends_on:
      postgres:
        condition: service_healthy

  ai-service:
    build:
      context: ai-service
      dockerfile: Dockerfile

    container_name: ai-service
    networks:
      - v1_network
    # 호스트 포트를 노출하지 않는다. 외부 진입점은 gateway-service 하나뿐이며,
    # 이 서비스는 v1_network 안에서 서비스명으로만 접근할 수 있다.

    environment:
      DB_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB}?currentSchema=ai_schema
      DB_USERNAME: ${POSTGRES_USER}
      DB_PASSWORD: ${POSTGRES_PASSWORD}
      AI_API_KEY: ${AI_API_KEY}
      EUREKA_URL: http://eureka-server:19090/eureka/
      ZIPKIN_ENDPOINT: http://zipkin:9411/api/v2/spans
      INTERNAL_API_KEY: ${INTERNAL_API_KEY}

    depends_on:
      postgres:
        condition: service_healthy

  user-service:
    build:
      context: user-service
      dockerfile: Dockerfile

    container_name: user-service
    networks:
      - v1_network
    # 호스트 포트를 노출하지 않는다. 외부 진입점은 gateway-service 하나뿐이며,
    # 이 서비스는 v1_network 안에서 서비스명으로만 접근할 수 있다.

    environment:
      DB_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB}?currentSchema=user_schema
      DB_USERNAME: ${POSTGRES_USER}
      DB_PASSWORD: ${POSTGRES_PASSWORD}
      SECURITY_JWT_SECRET: ${SECURITY_JWT_SECRET}
      EUREKA_URL: http://eureka-server:19090/eureka/
      ZIPKIN_ENDPOINT: http://zipkin:9411/api/v2/spans

    depends_on:
      postgres:
        condition: service_healthy
    
    restart: on-failure
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:19092/actuator/health"]
      interval: 10s
      timeout: 5s
      retries: 5

  gateway-service:
    build:
      context: gateway-service
      dockerfile: Dockerfile

    container_name: gateway-service
    networks:
      - v1_network
    ports:
      - "19091:19091"

    environment:
      EUREKA_URL: http://eureka-server:19090/eureka/
      JWT_SECRET: ${JWT_SECRET}
      ZIPKIN_ENDPOINT: http://zipkin:9411/api/v2/spans


  zipkin:
    image: openzipkin/zipkin
    container_name: zipkin
    networks:
      - v1_network
    ports:
      - "9411:9411"


volumes:
  postgres-data:
